# Render 배포 설정 (Blueprint).
# Render 대시보드에서 이 저장소를 연결하면 이 파일을 읽어 자동으로 서비스를 만든다.
services:
  - type: web
    name: meeting-notes
    runtime: node
    plan: free
    rootDir: meeting-minutes
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
